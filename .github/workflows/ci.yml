name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy apps services packages
      - run: pytest -q tests/unit tests/contract tests/adversarial
      - run: DATABASE_URL=sqlite+aiosqlite:///./ci.db alembic upgrade head
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd apps/web && npm install && npm run typecheck && npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/api.Dockerfile -t rsi-api .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t rsi-web .
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with: {path: ".", format: "spdx-json", output-file: "sbom.spdx.json"}
      - uses: gitleaks/gitleaks-action@v2
