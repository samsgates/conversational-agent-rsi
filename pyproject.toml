[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational-agent-rsi"
version = "0.1.0"
description = "Conversation-first recursive self-improvement platform for RAG grounded agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "pyyaml>=6.0,<7",
  "python-multipart>=0.0.17,<1",
  "PyJWT>=2.10,<3",
  "cryptography>=44,<46",
  "redis>=5.2,<6",
  "nats-py>=2.9,<3",
  "qdrant-client>=1.12,<2",
  "boto3>=1.35,<2",
  "temporalio>=1.8,<2",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*", "packages*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = []

